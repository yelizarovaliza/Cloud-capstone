name: CI

on:
  push:
    branches:
      - milestone-2
  pull_request:
    branches:
      - milestone-2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-build:
    name: Format, Tests, OpenAPI and Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Validate IAM Terraform module
        working-directory: infrastructure/iam
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate Network Terraform module
        working-directory: infrastructure/network
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: application/pyproject.toml

      - name: Install application and test dependencies
        working-directory: application
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Check Python formatting
        working-directory: application
        run: python -m ruff format --check app tests

      - name: Run tests
        working-directory: application
        run: python -m pytest

      - name: Validate OpenAPI specification
        run: |
          python -c "import yaml; from openapi_spec_validator import validate_spec; spec=yaml.safe_load(open('docs/api/openapi.yaml', encoding='utf-8')); validate_spec(spec); print('OpenAPI specification is valid.')"

      - name: Build Docker image
        run: docker build -t cloud-capstone:${{ github.sha }} -f application/Dockerfile application

      - name: Run application container
        run: |
          docker run -d \
            --name cloud-capstone-smoke \
            -p 8000:8000 \
            cloud-capstone:${{ github.sha }}

      - name: Smoke test application
        run: |
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8000/health -o health.json; then
              python -c "import json; assert json.load(open('health.json')) == {'status': 'ok'}"
              curl --fail --silent http://127.0.0.1:8000/openapi.json -o /dev/null
              echo "Health check and OpenAPI smoke test passed."
              exit 0
            fi
            sleep 2
          done

          docker logs cloud-capstone-smoke
          echo "Application failed to become healthy."
          exit 1

      - name: Clean up smoke test container
        if: always()
        run: docker rm -f cloud-capstone-smoke || true

  deployment-verification:
    name: Deployment Health and Smoke Tests
    runs-on: ubuntu-latest
    needs: quality-and-build
    if: github.event_name == 'workflow_dispatch'

    environment:
      name: deployment

    permissions:
      contents: read

    env:
      DEPLOYMENT_BASE_URL: ${{ vars.DEPLOYMENT_BASE_URL }}

    steps:
      - name: Validate deployment URL
        run: |
          if [ -z "$DEPLOYMENT_BASE_URL" ]; then
            echo "::error::DEPLOYMENT_BASE_URL is not configured in the deployment environment."
            exit 1
          fi

          echo "Deployment URL is configured."

      - name: Verify deployed health endpoint
        run: |
          BASE_URL="${DEPLOYMENT_BASE_URL%/}"

          for attempt in $(seq 1 20); do
            if curl --silent --show-error --fail \
              "$BASE_URL/health" -o health.json; then

              python -c "import json; assert json.load(open('health.json')) == {'status': 'ok'}"

              echo "Deployment health check passed."
              exit 0
            fi

            sleep 5
          done

          echo "::error::Deployment health check failed."
          exit 1

      - name: Verify deployed OpenAPI endpoint
        run: |
          BASE_URL="${DEPLOYMENT_BASE_URL%/}"

          curl --silent --show-error --fail \
            "$BASE_URL/openapi.json" -o openapi.json

          python -c "import json; spec=json.load(open('openapi.json')); assert 'openapi' in spec and 'paths' in spec"

          echo "Deployment OpenAPI smoke test passed."
